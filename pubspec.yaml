name: attendance
description: "Premium small-business attendance app (owner + employee)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.1
  go_router: ^18.1.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  qr_flutter: ^4.1.0
  riverpod: ^3.4.3
  supabase: ^2.16.5
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - .env

  # Inter variable font: weight entries map TextStyle.fontWeight onto the
  # font's wght axis (documented Flutter variable-font pattern).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 300
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
